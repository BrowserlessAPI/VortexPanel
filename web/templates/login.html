<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VortexPanel — Login</title>
<link rel="stylesheet" href="/static/css/app.css">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
<script src="/static/js/app.js"></script>
</head>
<body>

<div x-data="login" class="login-page">
  <div class="login-glow"></div>

  <div class="login-card">
    <!-- Theme switcher -->
    <div style="position:absolute; top:16px; right:16px; display:flex; gap:4px;">
      <button @click="setTheme('blue')"
        style="width:14px;height:14px;border-radius:50%;background:#0EA5E9;border:none;cursor:pointer;"
        title="Blue"></button>
      <button @click="setTheme('purple')"
        style="width:14px;height:14px;border-radius:50%;background:#8B5CF6;border:none;cursor:pointer;"
        title="Purple"></button>
      <button @click="setTheme('emerald')"
        style="width:14px;height:14px;border-radius:50%;background:#10B981;border:none;cursor:pointer;"
        title="Emerald"></button>
    </div>

    <!-- Logo -->
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff;margin:0 auto 14px;box-shadow:0 8px 20px rgba(0,0,0,0.3);">VP</div>
      <h1 style="font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-0.4px;">VortexPanel</h1>
      <p style="font-size:13px;color:var(--t4);margin-top:4px;">Sign in to your server panel</p>
    </div>

    <form @submit.prevent="submit">
      <div class="form-group">
        <label>Username or Email</label>
        <input type="text" x-model="username" placeholder="admin" required autofocus>
      </div>

      <div class="form-group" style="margin-bottom:20px;">
        <label>Password</label>
        <div style="position:relative;">
          <input :type="show_pw ? 'text' : 'password'" x-model="password"
            placeholder="••••••••••••" required style="padding-right:40px;">
          <button type="button" @click="show_pw = !show_pw"
            style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--t4);font-size:16px;cursor:pointer;">
            <span x-text="show_pw ? '🙈' : '👁'"></span>
          </button>
        </div>
      </div>

      <div x-show="error" style="margin-bottom:14px;padding:10px 14px;border-radius:8px;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;font-size:13px;" x-text="error"></div>

      <button type="submit" :disabled="loading" class="btn btn-primary w-full"
        style="justify-content:center;padding:11px;">
        <span x-show="loading" class="spin" style="margin-right:6px;">⟳</span>
        <span x-text="loading ? 'Signing in…' : 'Sign In'"></span>
      </button>
    </form>

    <p style="margin-top:20px;text-align:center;font-size:11px;color:var(--border2);">
      Locked out? Run <code style="color:var(--t4);">vortexpanel reset-password</code>
    </p>
  </div>
</div>

<script>
const t = localStorage.getItem('vp_theme') || 'blue';
document.documentElement.setAttribute('data-theme', t);

// helper for theme switcher on login page
function setTheme(t) {
    localStorage.setItem('vp_theme', t);
    document.documentElement.setAttribute('data-theme', t);
}
</script>

</body>
</html>
